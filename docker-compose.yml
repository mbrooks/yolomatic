services:
  tars:
    image: tars-control-plane:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: tars
    restart: unless-stopped
    ports:
      - "127.0.0.1:6767:6767"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
      TARS_WORKER_RUNTIME_DIR: /app/runtime
      TARS_WORKER_RUNTIME_MOUNT_SOURCE: tars_runtime
      TARS_WORKER_WORKSPACE_MOUNT_SOURCE: tars_workspaces
      TARS_WORKER_OLLAMA_HOST: http://host.docker.internal:11434
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - tars_sessions:/app/sessions
      - tars_workspaces:/app/workspaces
      - tars_pi:/home/tars/.pi/agent
      - tars_memory:/app/memory
      - tars_runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock

  ollama:
    image: alpine/ollama:0.20.5
    container_name: tars-ollama
    network_mode: "service:tars"
    restart: unless-stopped
    volumes:
      - ${HOME}/.ollama:/root/.ollama

volumes:
  tars_sessions:
  tars_workspaces:
  tars_pi:
  tars_memory:
  tars_runtime:
