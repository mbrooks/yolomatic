apiVersion: apps/v1
kind: Deployment
metadata:
  name: tars
  namespace: agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tars
  template:
    metadata:
      labels:
        app: tars
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: tars
          image: docker.io/library/tars-tars:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: tars-env
          env:
            - name: OLLAMA_HOST
              value: http://127.0.0.1:11434
          ports:
            - name: http
              containerPort: 6767
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: sessions
              mountPath: /app/sessions
            - name: workspaces
              mountPath: /app/workspaces
            - name: pi-agent
              mountPath: /home/tars/.pi/agent
            - name: memory
              mountPath: /app/memory
        - name: ollama
          image: alpine/ollama:0.20.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: ollama
              containerPort: 11434
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: sessions
          hostPath:
            path: /var/lib/docker/volumes/tars_tars_sessions/_data
            type: DirectoryOrCreate
        - name: workspaces
          hostPath:
            path: /var/lib/docker/volumes/tars_tars_workspaces/_data
            type: DirectoryOrCreate
        - name: pi-agent
          hostPath:
            path: /var/lib/docker/volumes/tars_tars_pi/_data
            type: DirectoryOrCreate
        - name: memory
          hostPath:
            path: /var/lib/docker/volumes/tars_tars_memory/_data
            type: DirectoryOrCreate
        - name: ollama-data
          hostPath:
            path: /var/lib/docker/volumes/tars_tars_ollama/_data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: tars
  namespace: agents
spec:
  selector:
    app: tars
  ports:
    - name: http
      port: 6767
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tars
  namespace: agents
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - gh.onete.am
      secretName: gh-onete-am-tls
  rules:
    - host: gh.onete.am
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tars
                port:
                  number: 6767
          - path: /tarsadmin
            pathType: Prefix
            backend:
              service:
                name: tars
                port:
                  number: 6767
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: tars
                port:
                  number: 6767
